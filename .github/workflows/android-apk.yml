name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the workflow only builds, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "platforms;android-35"
  ANDROID_BUILD_TOOLS: "build-tools;35.0.0"
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licences and install SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platform-tools" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS"

      # Validates gradle-wrapper.jar against official checksums and caches Gradle downloads.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keeps the same debug signing key between runs, so a new APK installs over the old one
      # without uninstalling (which would delete your course data). See README.
      - name: Reuse debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # Optional and more permanent: a keystore stored as the DEBUG_KEYSTORE_BASE64 repository secret.
      - name: Use stable debug keystore from secret (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ci-debug.keystore"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/ci-debug.keystore" >> "$GITHUB_ENV"
            echo "Using keystore from repository secret."
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret; using cached ~/.android/debug.keystore."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            ls -R app/build/outputs || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" dist/EnglishPartnerLearningHub-debug.apk
          ls -lh dist
          sha256sum dist/EnglishPartnerLearningHub-debug.apk

      # Only the APK is uploaded: no source, no signing keys, no course materials.
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: EnglishPartnerLearningHub-debug-apk
          path: dist/EnglishPartnerLearningHub-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
